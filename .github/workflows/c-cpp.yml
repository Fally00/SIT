name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Smoke test — help
      run: ./build/sysinfo --help
      shell: bash

    - name: Smoke test — JSON
      run: ./build/sysinfo info --format=json
      shell: bash

    - name: Smoke test — schema
      run: ./build/sysinfo schema
      shell: bash
